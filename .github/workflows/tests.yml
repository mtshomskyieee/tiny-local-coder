name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Same entrypoint as the local pre-commit hook, so CI and a developer
      # machine cannot disagree about how the suite is run. The tests never
      # call the model, so no Ollama service is needed here.
      - name: Run unit tests
        run: ./run-tests.sh
