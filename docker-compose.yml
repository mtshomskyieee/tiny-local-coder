name: tinylocalcoder
services:
  ollama:
    # Pinned: `latest` silently changes the concurrency/memory defaults below
    # on every rebuild, which is how a 3B model came to exhaust a 12 GB laptop.
    image: ollama/ollama:0.34.0
    ports:
      - "11434:11434"
    # One user, one small model, one request at a time. Left on auto, Ollama
    # keeps up to 3 copies of the weights resident and 4 parallel slots, each
    # with its own KV cache, so NUM_CTX no longer bounds the footprint. The
    # OLLAMA_* env vars below are the real cap; the limits here are a backstop.
    #
    # Rootless Docker only enforces a memory limit if the memory cgroup
    # controller is delegated to your user slice. Without it Docker prints
    # "Your kernel does not support memory limit capabilities" and ignores
    # these. Set OLLAMA_MEM_LIMIT=0 / APP_MEM_LIMIT=0 to drop them and silence
    # the warning; see README "Memory on a low-RAM host" to enable delegation.
    mem_limit: ${OLLAMA_MEM_LIMIT:-5g}
    memswap_limit: ${OLLAMA_MEM_LIMIT:-5g}
    environment:
      # Resolved from config.toml (model = "qwen2.5" | "qwen3.5")
      - MODEL_NAME=${MODEL_NAME:-qwen2.5:3b}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
      - OLLAMA_MAX_QUEUE=${OLLAMA_MAX_QUEUE:-1}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-5m}
    entrypoint: ["/bin/sh", "/ollama-entrypoint.sh"]
    volumes:
      - ollama_data:/root/.ollama
      - ./scripts/ollama-entrypoint.sh:/ollama-entrypoint.sh:ro
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  app:
    build:
      context: .
      args:
        EXTRA_APT_PACKAGES: ${EXTRA_APT_PACKAGES:-}
    depends_on:
      ollama:
        condition: service_healthy
    mem_limit: ${APP_MEM_LIMIT:-1g}
    memswap_limit: ${APP_MEM_LIMIT:-1g}
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      # Active model comes from config.toml via ./start-service.sh
      MODEL_NAME: ${MODEL_NAME:-qwen2.5:3b}
      TLC_MODEL_KEY: ${TLC_MODEL_KEY:-qwen2.5}
      TLC_CONFIG: /app/config.toml
      NUM_CTX: ${NUM_CTX:-2048}
      THINKING_ENABLED: ${THINKING_ENABLED:-true}
      AUTO_FIX: ${AUTO_FIX:-true}
      AUTO_FIX_MAX: ${AUTO_FIX_MAX:-1}
      AUTO_SKIP: ${AUTO_SKIP:-true}
      AUTO_REPLAN: ${AUTO_REPLAN:-true}
      AUTO_INSTALL: ${AUTO_INSTALL:-true}
      WORKSPACE_DIR: /workspace
      EXEC_TIMEOUT_SEC: ${EXEC_TIMEOUT_SEC:-60}
    volumes:
      - ./workspace:/workspace
      - ./config.toml:/app/config.toml:ro
      # Live package so /review and other host edits apply without --build
      - ./src/tinylocalcoder:/app/src/tinylocalcoder:ro
    ports:
      - "8000:8000"
    stdin_open: true
    tty: true
    command: ["api"]

volumes:
  ollama_data:
    external: true
    name: crew_pipeline_ollama_data
