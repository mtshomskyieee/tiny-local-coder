[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tinylocalcoder"
version = "0.1.0"
description = "File-backed LangGraph agents with local Ollama (plan / code / execute / ask)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "langchain>=0.3.0",
  "langchain-core>=0.3.0",
  "langchain-ollama>=0.2.0",
  "langgraph>=0.2.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "textual>=0.86.0",
  "httpx>=0.27.0",
]

[project.scripts]
tinylocalcoder = "tinylocalcoder.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
